[package]
name = "sc_slicer"
version = "0.2.0"
edition = "2021"
description = "Source-backed Solidity code slice resurrection tool"
authors = ["SC_Slicer Team"]
license = "MIT OR Apache-2.0"
repository = "https://gitee.com/w1060/sc_slicer_standalone"
keywords = ["solidity", "code-analysis", "slicing", "security"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
# Standard libraries
anyhow = "1.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.148"
# CLI and async
clap = { version = "4.0", features = ["derive"] }
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread", "process", "sync"] }
regex = "1.11"
