<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 1120" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',system-ui,sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4B5563"/>
    </marker>
    <marker id="arrowg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3E7D50"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="980" height="1120" fill="#FFFFFF"/>

  <text x="490" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#1F2933">阶段二流程：漏洞报告 → 推导不变量 → 形式化约束</text>
  <text x="490" y="64" text-anchor="middle" font-size="13" fill="#6B7280">tools/report_constraints_v2 · semantic-live-5 · 生成模型 deepseek-flash（零人工）</text>

  <!-- ===== 左侧贯穿审计轨 ===== -->
  <rect x="30" y="96" width="192" height="900" rx="10" fill="#F8FAFC" stroke="#8A93A2" stroke-dasharray="6 4" stroke-width="1.5"/>
  <text x="126" y="126" text-anchor="middle" font-size="14" font-weight="700" fill="#4B5563">verify</text>
  <text x="126" y="146" text-anchor="middle" font-size="12" fill="#4B5563">零模型调用离线重放</text>
  <text x="126" y="176" text-anchor="middle" font-size="12" fill="#6B7280">prompt 快照</text>
  <text x="126" y="196" text-anchor="middle" font-size="12" fill="#6B7280">功能决策 prompt_features</text>
  <text x="126" y="216" text-anchor="middle" font-size="12" fill="#6B7280">产物哈希指纹</text>
  <text x="126" y="250" text-anchor="middle" font-size="12" fill="#6B7280">任何历史 run</text>
  <text x="126" y="270" text-anchor="middle" font-size="12" fill="#6B7280">可复审、重放不变</text>
  <text x="126" y="960" text-anchor="middle" font-size="12" fill="#8A93A2">（贯穿阶段二全程的审计层）</text>

  <!-- ===== 主流水 ===== -->
  <!-- 1 输入 -->
  <rect x="250" y="96" width="470" height="58" rx="8" fill="#F5F7FA" stroke="#5B6B7D" stroke-width="1.6"/>
  <text x="485" y="120" text-anchor="middle" font-size="15" font-weight="700" fill="#1F2933">输入</text>
  <text x="485" y="142" text-anchor="middle" font-size="13" fill="#374151">report.json（漏洞报告原文）+ metadata</text>

  <line x1="485" y1="154" x2="485" y2="178" stroke="#4B5563" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- 2 ingest -->
  <rect x="250" y="180" width="470" height="78" rx="8" fill="#F5F7FA" stroke="#5B6B7D" stroke-width="1.6"/>
  <text x="485" y="204" text-anchor="middle" font-size="15" font-weight="700" fill="#1F2933">lib/ingest.py · 证据编号与入口门</text>
  <text x="485" y="226" text-anchor="middle" font-size="13" fill="#374151">原文切片编号 → 证据 ID 回填</text>
  <text x="485" y="246" text-anchor="middle" font-size="13" fill="#374151">提取前信息充分性门（四要素齐备才放行）</text>

  <line x1="720" y1="219" x2="752" y2="219" stroke="#C2703A" stroke-width="1.6" marker-end="url(#arrow)"/>
  <rect x="756" y="194" width="204" height="52" rx="8" fill="#FDF1E7" stroke="#C2703A" stroke-width="1.4"/>
  <text x="858" y="214" text-anchor="middle" font-size="11" font-weight="700" fill="#9A4E1B">excluded_before_extraction</text>
  <text x="858" y="232" text-anchor="middle" font-size="12" fill="#9A4E1B">信息不足：停止，不生成要素</text>

  <line x1="485" y1="258" x2="485" y2="282" stroke="#4B5563" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- 3 模型调用① -->
  <rect x="250" y="284" width="470" height="104" rx="8" fill="#F4EFFA" stroke="#7B5CB8" stroke-width="1.8"/>
  <text x="485" y="308" text-anchor="middle" font-size="15" font-weight="700" fill="#4C3577">模型调用① 要素提取（DeepSeek）</text>
  <text x="485" y="330" text-anchor="middle" font-size="13" fill="#374151">prompt-element.txt（prompts/current.py）</text>
  <text x="485" y="350" text-anchor="middle" font-size="13" fill="#374151">→ elements-ids.json：P 前提 / I 应满足性质 / V 违反结果</text>
  <text x="485" y="370" text-anchor="middle" font-size="12.5" font-weight="700" fill="#7B5CB8">★ 任务目标 1：报告声称的不变量在这里被推导</text>

  <line x1="485" y1="388" x2="485" y2="412" stroke="#4B5563" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- 4 要素校验 -->
  <rect x="250" y="414" width="470" height="60" rx="8" fill="#F5F7FA" stroke="#5B6B7D" stroke-width="1.6"/>
  <text x="485" y="438" text-anchor="middle" font-size="15" font-weight="700" fill="#1F2933">要素合法性校验</text>
  <text x="485" y="460" text-anchor="middle" font-size="13" fill="#374151">结构 / P 时序角色（后置观察量不得入 P）/ 证据 ID</text>

  <line x1="720" y1="444" x2="752" y2="444" stroke="#C2703A" stroke-width="1.6" marker-end="url(#arrow)"/>
  <rect x="756" y="420" width="204" height="48" rx="8" fill="#FDF1E7" stroke="#C2703A" stroke-width="1.4"/>
  <text x="858" y="440" text-anchor="middle" font-size="12" font-weight="700" fill="#9A4E1B">拒绝：要素不合法</text>
  <text x="858" y="458" text-anchor="middle" font-size="12" fill="#9A4E1B">→ review / abstain</text>

  <line x1="485" y1="474" x2="485" y2="498" stroke="#4B5563" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- 5 模型调用② -->
  <rect x="250" y="500" width="470" height="90" rx="8" fill="#F4EFFA" stroke="#7B5CB8" stroke-width="1.8"/>
  <text x="485" y="524" text-anchor="middle" font-size="15" font-weight="700" fill="#4C3577">模型调用② 形式化（DeepSeek）</text>
  <text x="485" y="546" text-anchor="middle" font-size="13" fill="#374151">→ formal-plan.json：符号表（sort·unit·时点·来源）+ 谓词</text>
  <text x="485" y="566" text-anchor="middle" font-size="13" fill="#374151">模板：relation_obligation / monotonicity / conservation</text>
  <text x="485" y="584" text-anchor="middle" font-size="12.5" font-weight="700" fill="#7B5CB8">★ 任务目标 2：不变量转化为形式约束</text>

  <line x1="485" y1="590" x2="485" y2="614" stroke="#4B5563" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- 6 机械门 -->
  <rect x="250" y="616" width="470" height="92" rx="8" fill="#F5F7FA" stroke="#5B6B7D" stroke-width="1.6"/>
  <text x="485" y="640" text-anchor="middle" font-size="15" font-weight="700" fill="#1F2933">机械门 + 修复通道（plan_synthesizer · salvage）</text>
  <text x="485" y="662" text-anchor="middle" font-size="13" fill="#374151">数值/地址保真 · 重复谓词门 · 部分形式化降级</text>
  <text x="485" y="682" text-anchor="middle" font-size="13" fill="#374151">requirement / intent-scope 两个 advisory 侧车</text>
  <text x="485" y="702" text-anchor="middle" font-size="13" fill="#374151">不忠实计划在生成期被拒；修复通道做字段级局部重试</text>

  <rect x="756" y="622" width="204" height="64" rx="8" fill="#FFFDF3" stroke="#B59A3A" stroke-width="1.4"/>
  <text x="858" y="646" text-anchor="middle" font-size="12" font-weight="700" fill="#8A6D1C">局部修复 → 重试（≤1 次）</text>
  <text x="858" y="666" text-anchor="middle" font-size="12" fill="#8A6D1C">字段级约束修复</text>
  <line x1="756" y1="640" x2="722" y2="560" stroke="#B59A3A" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <line x1="720" y1="668" x2="752" y2="660" stroke="#B59A3A" stroke-width="1.4" marker-end="url(#arrow)"/>

  <line x1="485" y1="708" x2="485" y2="732" stroke="#4B5563" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- 7 Z3 -->
  <rect x="250" y="734" width="470" height="74" rx="8" fill="#F5F7FA" stroke="#5B6B7D" stroke-width="1.6"/>
  <text x="485" y="758" text-anchor="middle" font-size="15" font-weight="700" fill="#1F2933">编译 + Z3 一致性（semantic_core · solving）</text>
  <text x="485" y="780" text-anchor="middle" font-size="13" fill="#374151">P∧T 可行？P∧I 矛盾？witness 校验</text>
  <text x="485" y="800" text-anchor="middle" font-size="13" fill="#374151">内部矛盾的缺陷计划在此被正确拦截</text>

  <line x1="720" y1="771" x2="752" y2="771" stroke="#C2703A" stroke-width="1.6" marker-end="url(#arrow)"/>
  <rect x="756" y="748" width="204" height="48" rx="8" fill="#FDF1E7" stroke="#C2703A" stroke-width="1.4"/>
  <text x="858" y="768" text-anchor="middle" font-size="12" font-weight="700" fill="#9A4E1B">Z3 一致性拦截</text>
  <text x="858" y="786" text-anchor="middle" font-size="12" fill="#9A4E1B">缺陷计划被拦下（终局批 2 例）</text>

  <line x1="485" y1="808" x2="485" y2="832" stroke="#3E7D50" stroke-width="2" marker-end="url(#arrowg)"/>

  <!-- 8 产物（终点） -->
  <rect x="250" y="834" width="470" height="104" rx="8" fill="#EAF5EE" stroke="#3E7D50" stroke-width="1.8"/>
  <text x="485" y="858" text-anchor="middle" font-size="15" font-weight="700" fill="#1E5A31">run 目录落盘（每次运行的全部产物）</text>
  <text x="485" y="880" text-anchor="middle" font-size="13" fill="#374151">formalization.json · constraints.json</text>
  <text x="485" y="900" text-anchor="middle" font-size="13" fill="#374151">auto-triage.json：candidate / review / abstain</text>
  <text x="485" y="920" text-anchor="middle" font-size="13" font-weight="700" fill="#1E5A31">★ stage3-spec.json：claim + 查询 + binding_contract</text>

  <line x1="485" y1="938" x2="485" y2="962" stroke="#3E7D50" stroke-width="2" marker-end="url(#arrowg)"/>

  <!-- 交接边界 -->
  <rect x="330" y="964" width="310" height="44" rx="22" fill="#FFFFFF" stroke="#8A93A2" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text x="485" y="991" text-anchor="middle" font-size="13" fill="#4B5563">阶段二边界 · 产物交阶段三</text>

  <!-- 图例 -->
  <g font-size="12.5" fill="#374151">
    <rect x="250" y="1040" width="16" height="16" rx="3" fill="#F5F7FA" stroke="#5B6B7D" stroke-width="1.4"/>
    <text x="272" y="1053">确定性代码（无模型调用）</text>
    <rect x="450" y="1040" width="16" height="16" rx="3" fill="#F4EFFA" stroke="#7B5CB8" stroke-width="1.4"/>
    <text x="472" y="1053">模型调用（唯一非机械环节）</text>
    <rect x="650" y="1040" width="16" height="16" rx="3" fill="#FDF1E7" stroke="#C2703A" stroke-width="1.4"/>
    <text x="672" y="1053">拒绝 / 修复通道</text>
    <rect x="250" y="1066" width="16" height="16" rx="3" fill="#EAF5EE" stroke="#3E7D50" stroke-width="1.4"/>
    <text x="272" y="1079">最终产物（落盘）</text>
    <rect x="450" y="1066" width="16" height="16" rx="3" fill="#F8FAFC" stroke="#8A93A2" stroke-width="1.4" stroke-dasharray="4 3"/>
    <text x="472" y="1079">离线重放审计（verify）</text>
  </g>
</svg>
