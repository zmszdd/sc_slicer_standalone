name: ci

on:
  push:
  pull_request:

jobs:
  stage1-rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: foundry-rs/foundry-toolchain@v1
      - name: cargo fmt
        run: cargo fmt --check
      - name: cargo test
        run: cargo test --locked

  stage1-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: foundry-rs/foundry-toolchain@v1
      - name: slicer + forge e2e
        run: ./run.sh

  stage2-offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: install z3
        run: pip install z3-solver
      - name: stage-2 regression
        run: python main.py test
      - name: frozen assets
        run: python main.py frozen
      - name: whitespace check
        run: git diff --check

  stage3-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: foundry-rs/foundry-toolchain@v1
      - name: install z3
        run: pip install z3-solver
      - name: stage-3 regression
        run: |
          cd tools/stage3
          python -m unittest discover -s tests
      - name: metrics consistency
        run: |
          cd tools/stage3
          python -m cli.stage3_metrics_sync --check

  pipeline-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: foundry-rs/foundry-toolchain@v1
      - name: install z3
        run: pip install z3-solver
      - name: pipeline regression (serial-chain e2e included)
        run: |
          cd tools/pipeline
          python -m unittest discover -s tests
